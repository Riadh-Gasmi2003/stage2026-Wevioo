# Enregistre la police FreeSerif (fonts.xml) auprès de JasperReports, pour que
# le PDF puisse afficher les caractères arabes (voir fonts.xml pour le détail).
net.sf.jasperreports.extension.registry.factory.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.fonts=fonts.xml
