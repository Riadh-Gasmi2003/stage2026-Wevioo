# Police par défaut pour tous les rapports JasperReports du projet.
# FreeSerif est déclarée dans fonts.xml (voir jasperreports_extension.properties) ;
# ce fichier en fait la police par défaut pour tout élément qui ne précise pas
# fontName explicitement, afin que le texte arabe s'affiche partout, y compris
# dans les champs de valeurs (noms, dates...) qui n'ont pas de balise <font>.
net.sf.jasperreports.default.font.name=FreeSerif
net.sf.jasperreports.default.pdf.font.name=FreeSerif
net.sf.jasperreports.default.pdf.encoding=Identity-H
net.sf.jasperreports.default.pdf.embedded=true
